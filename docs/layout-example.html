<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout Panel Example</title>
    <style>
        body { font-family: sans-serif; margin: 0; background-color: #f4f4f4; padding: 20px; }
        .panel {
            border: 2px solid;
            padding: 15px;
            margin: 5px;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
            color: #333;
        }
        .panel-title { font-size: 1.2em; margin-bottom: 10px; }
        .scrm-app-panel { border-color: #4A90E2; background-color: #F0F8FF; }
        .scrm-head-panel { border-color: #F5A623; background-color: #FFF8E1; min-height: 60px; }
        .scrm-middle-panel { border-color: #50E3C2; background-color: #E6FFFA; display: flex; padding: 10px; }
        .scrm-side-panel { border-color: #B8E986; background-color: #F4FFF0; width: 20%; }
        .scrm-main-panel { border-color: #9013FE; background-color: #F5EFFF; flex-grow: 1; }
        .scrm-search-div { border-color: #D0021B; background-color: #FFEEEE; min-height: 50px; }
        .scrm-component-panel { border-color: #777; background-color: #FAFAFA; margin-top: 10px; min-height: 250px; }
        .scrm-footer-panel { border-color: #444; background-color: #EAEAEA; min-height: 50px; }
        .scrm-flex-panel { display: flex; justify-content: space-between; border-color: #9e9e9e; background-color: #f5f5f5; margin-top:10px; }
        .scrm-lfloat-div { border: 2px dashed #ff9800; background-color: #fff3e0; width: 48%; padding:10px; }
        .scrm-rfloat-div { border: 2px dashed #4caf50; background-color: #e8f5e9; width: 48%; padding:10px; }
    </style>
</head>
<body>
    <div class="panel scrm-app-panel">
        <div class="panel-title">AppPanel</div>
        <div class="panel scrm-head-panel">HeadPanel</div>
        <div class="panel scrm-middle-panel">
            <div class="panel scrm-side-panel">SidePanel</div>
            <div class="panel scrm-main-panel">
                <div class="panel-title">MainPanel</div>
                <div class="panel scrm-search-div">SearchPanel</div>
                <div class="panel scrm-component-panel">
                    ComponentPanel
                    <div class="panel scrm-flex-panel">
                        <div class="scrm-lfloat-div">LFloatArea</div>
                        <div class="scrm-rfloat-div">RFloatArea</div>
                    </div>
                </div>
            </div>
        </div>
        <div class="panel scrm-footer-panel">FooterPanel</div>
    </div>
</body>
</html>
