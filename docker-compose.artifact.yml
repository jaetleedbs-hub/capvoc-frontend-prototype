services:
  admin-frontend:
    # [이름 규칙] 전 서비스 공통: helpdesk-{서비스}. 근거: docs/CLAUDE.md §4-1
    #  Jenkinsfile 의 DOCKER_IMAGE·DOCKER_NAME 과 <같은 값이어야> 한다.
    image: helpdesk-admin-frontend:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.runtime
    container_name: helpdesk-admin-frontend
    ports:
      - "${APP_HTTP_PORT}:80"   # HTTP
      - "${APP_HTTPS_PORT}:443"   # HTTPS
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /home/chatcall/logs/admin-frontend:/var/log/nginx
    env_file:
      - .env
    environment:
      NODE_ENV: production
      TZ: Asia/Seoul
    restart: unless-stopped
    # ★ 컨테이너 stdout 로그의 상한. 없으면 무한히 자란다.
    #  이 프로젝트는 이것으로 이미 장애를 냈다 — .210·.211 의 디스크가 100% 로 찼다.
    #  ⛔ daemon.json 을 나중에 고쳐도 <이미 만들어진 컨테이너에는 안 먹는다>(생성 시점 고정).
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    healthcheck:
      # localhost 를 쓰지 않는다 — 컨테이너 안에서 ::1 로 먼저 풀려 IPv4 전용 리슨과 어긋난다.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/ >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - admin-net

networks:
  admin-net:
    driver: bridge